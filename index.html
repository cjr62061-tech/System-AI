<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BHAI KI SITE - AI + WHITEBOARD</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
  body{background:#0f0f0f;color:white;height:100vh;display:flex;flex-direction:column}
  /* UPAR WALA PART - AI BOARD */
  #ai-board{flex:1;display:flex;flex-direction:column;background:#1a1a1a;padding:10px;overflow:hidden}
  #ai-top{font-weight:bold;font-size:18px;text-align:center;padding:8px;background:#222;border-radius:10px}
  #ai-top span{color:#00ff88}
  #chat-area{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:10px}
  .msg{background:#2a2a2a;padding:10px;border-radius:12px;max-width:90%}
  .msg.me{align-self:flex-end;background:#0055ff}
  .msg img{width:100%;border-radius:10px;margin-top:8px}
  .msg pre{background:black;color:#00ff88;padding:8px;border-radius:8px;white-space:pre-wrap;overflow-x:auto}
  .download-btn{background:#00ff88;color:black;border:none;padding:6px 10px;border-radius:8px;margin-top:6px;font-weight:bold}
  /* CHAT PANEL - NEECHE */
  #chat-panel{display:flex;gap:8px;padding:10px;background:#222}
  #chat-input{flex:1;padding:12px;border-radius:20px;border:none;outline:none;font-size:16px}
  #send-btn{background:#00ff88;border:none;padding:0 18px;border-radius:20px;font-weight:bold;font-size:18px}
  #quick-btns{display:flex;gap:6px;padding:0 10px 10px;background:#222;overflow-x:auto}
  #quick-btns button{white-space:nowrap;background:#333;color:white;border:1px solid #555;padding:6px 10px;border-radius:15px}
  /* NEECHE WALA PART - WHITEBOARD */
  #whiteboard-area{height:42vh;background:white;position:relative;display:flex}
  #toolbar{width:58px;background:#222;display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 4px}
  #toolbar button{width:42px;height:42px;border-radius:8px;border:2px solid #555;background:#333;color:white;font-size:18px}
  #toolbar button.active{border-color:#00ff88;background:#00aa66}
  #toolbar input[type=range]{width:42px}
  #toolbar input[type=color]{width:42px;height:32px;border:none}
  #toolbar label{font-size:10px;color:#aaa;text-align:center}
  #canvas{flex:1;touch-action:none;background:white;cursor:crosshair}
  #board-title{position:absolute;top:5px;left:65px;color:#888;font-size:12px}
</style>
</head>
<body>

<!-- UPAR WALA PART - AI -->
<div id="ai-board">
  <div id="ai-top">BHAI KA AI <span>● ONLINE</span> - Image / 3D / 2D / Code / BTech / 1-12 Sab Dega</div>
  <div id="chat-area">
    <div class="msg">Namaste Bhai! Main Tera AI Hu. Tu Bol - <br><b>"Dog Ki Image De"</b> / <b>"3D Cube De"</b> / <b>"Python Ka Code De"</b> / <b>"BTech Ka Data De"</b> / <b>"Class 10 Ka Science De"</b><br>Main Sab Dunga. Aur Download Bhi Kar Sakta Hai.</div>
  </div>
  <div id="quick-btns">
    <button onclick="quickAsk('Dog ki image de')">🖼️ Image</button>
    <button onclick="quickAsk('3D cube ka code de')">🧊 3D</button>
    <button onclick="quickAsk('2D drawing de')">✏️ 2D</button>
    <button onclick="quickAsk('Python ka code de')">💻 Code</button>
    <button onclick="quickAsk('BTech ka data de')">🎓 BTech</button>
    <button onclick="quickAsk('Class 10 science de')">📚 Class 10</button>
    <button onclick="quickAsk('GIF de')">🎞️ GIF</button>
    <button onclick="quickAsk('GLTF 3D model de')">📦 GLTF</button>
  </div>
  <div id="chat-panel">
    <input id="chat-input" placeholder="Bhai, yaha likh... Image / 3D / Code / Subject..." />
    <button id="send-btn" onclick="askAI()">➤</button>
  </div>
</div>

<!-- NEECHE WALA PART - WHITEBOARD -->
<div id="whiteboard-area">
  <div id="toolbar">
    <button id="penBtn" class="active" onclick="setTool('pen')" title="Pen">🖊️</button>
    <label>Pen Size</label>
    <input type="range" id="penSize" min="1" max="30" value="4" oninput="updateSize(this.value)">
    <span id="sizeShow" style="color:white;font-size:12px">4</span>
    <label>Color</label>
    <input type="color" id="penColor" value="#000000">
    <button id="eraserBtn" onclick="setTool('eraser')" title="Rubber">🧽</button>
    <button onclick="clearBoard()" title="Saaf Karo">🗑️</button>
    <button onclick="downloadBoard()" title="Download">⬇️</button>
  </div>
  <canvas id="canvas"></canvas>
  <div id="board-title">WHITEBOARD - Yaha Likh, Yaha Seekh ✍️</div>
</div>

<script>
  // ===== AI WALA PART =====
  const chatArea = document.getElementById('chat-area');
  const chatInput = document.getElementById('chat-input');

  function quickAsk(t){ chatInput.value = t; askAI(); }

  function addMsg(html, isMe){
    const d = document.createElement('div');
    d.className = 'msg' + (isMe ? ' me' : '');
    d.innerHTML = html;
    chatArea.appendChild(d);
    chatArea.scrollTop = chatArea.scrollHeight;
    return d;
  }

  function askAI(){
    let q = chatInput.value.trim();
    if(!q) return;
    addMsg(q, true);
    chatInput.value = '';
    let low = q.toLowerCase();

    // IMAGE - Agar Image Bola
    if(low.includes('image') || low.includes('photo') || low.includes('dog') || low.includes('jellyfish') || low.includes('pic')){
      let prompt = encodeURIComponent(q);
      let imgUrl = `https://image.pollinations.ai/prompt/${prompt}`;
      addMsg(`Le Bhai, Teri <b>${q}</b> Ki Image Ban Gayi! <br><img src="${imgUrl}"><br><a href="${imgUrl}" download="bhai-photo.jpg"><button class="download-btn">⬇️ Photo Download Karo</button></a><br><small>Ye Photo Har Jagah Chalegi - Phone, PC, Watch</small>`);
      return;
    }
    // 3D - Agar 3D Bola
    if(low.includes('3d') || low.includes('gltf') || low.includes('texture')){
      addMsg(`Le Bhai, Tera <b>3D Model</b> - GLTF + Texture Wala!<br><pre>// 3D Cube - GLTF Jaisa - Three.js Me Chalega
// Copy Karke HTML Me Chala
const cube = new THREE.Mesh(
  new THREE.BoxGeometry(1,1,1),
  new THREE.MeshStandardMaterial({color: 0x00ff88})
);
scene.add(cube);
// GLTF Download: https://github.com/KhronosGroup/glTF-Sample-Models
// Texture: https://poly.pizza - Free 3D Model Download Kar</pre><br><a href="https://poly.pizza" target="_blank"><button class="download-btn">⬇️ 3D Model Download Karo (GLTF)</button></a><br><small>Ye 3D Har Cheez Me Chalega - Game, App, Website</small>`);
      return;
    }
    // GIF - Agar GIF Bola
    if(low.includes('gif')){
      let gifUrl = `https://media.giphy.com/media/3o7TKSjRrfIPjeiVyM/giphy.gif`;
      addMsg(`Le Bhai, Tera <b>GIF</b>! <br><img src="${gifUrl}"><br><a href="${gifUrl}" download="bhai.gif"><button class="download-btn">⬇️ GIF Download Karo</button></a>`);
      return;
    }
    // CODE - Agar Code Bola
    if(low.includes('code') || low.includes('python') || low.includes('solidity') || low.includes('javascript')){
      addMsg(`Le Bhai, Tera <b>Code</b> - Full Systematic!<br><pre># BHAI KA CODE - ${q}
print("Hello Bhai - Tu Coder Hai")

# START
dog = "Super Dog"
print(dog)

# MID
for i in range(3):
    print(f"Dog Bhag Raha Hai - {i}")

# ADVANCE - API Se Data
# API: https://api.github.com - Sara Code Yaha Hai
# API: https://en.wikipedia.org/w/api.php - Sara Gyaan Yaha Hai</pre><br><button class="download-btn" onclick="downloadCode()">⬇️ Code Download Karo (.py)</button><br><small>Saari API Use Ki Hai - GitHub + Wikipedia + Pollinations</small>`);
      return;
    }
    // STUDY - BTech, MTech, BSC, MSC, PHD, 1-12
    if(low.includes('btech') || low.includes('mtech') || low.includes('bsc') || low.includes('msc') || low.includes('phd') || low.includes('class') || low.includes('12') || low.includes('10') || low.includes('science') || low.includes('subject')){
      addMsg(`Le Bhai, Tera <b>${q}</b> Ka Pura Systematic Data!<br><br><b>1. KYA HAI?</b> - ${q} duniya ka powerful subject hai.<br><b>2. KYU HAI?</b> - Iske bina duniya adhoori hai.<br><b>3. START</b> - Sabse aasan topic - Definition likh.<br><b>4. MID</b> - Thoda mushkil - Example likh.<br><b>5. ADVANCE</b> - Pura Project bana.<br><b>6. 700 LANGUAGE ME</b> - Yehi cheez 700 language me.<br><b>7. TU KYA BANAYEGA?</b> - Isse tu apna PC, Watch, Coin banayega.<br><br><b>API DATA:</b> Wikipedia - en.wikipedia.org | GitHub - api.github.com | NASA - api.nasa.gov<br><button class="download-btn" onclick="downloadNotes()">⬇️ Notes Download Karo</button>`);
      return;
    }
    // DEFAULT - Har Subject Ka Knowledge
    addMsg(`Le Bhai, Tera <b>${q}</b> Ka Pura Answer - Infinity Pattern Me!<br><br><b>1. KYA HAI?</b> - ${q} ek powerful cheez hai.<br><b>2. KYU HAI?</b> - Duniya ko iski zarurat hai.<br><b>3. START</b> - Pehla step - Isko dekh, samajh, likh.<br><b>4. MID</b> - Isko dusri cheez se jod.<br><b>5. ADVANCE</b> - Isse pura project bana.<br><b>6. DOWNLOAD</b> - Neeche Download dabao.<br><br><small>Tu Image bolega to Image, 3D bolega to 3D, Code bolega to Code - Sab Dunga.</small>`);
  }

  function downloadCode(){ 
    let blob = new Blob([`# BHAI KA CODE\nprint("Hello Bhai")`], {type:'text/plain'});
    let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download='bhai-code.py'; a.click();
  }
  function downloadNotes(){
    let blob = new Blob([`BHAI KA NOTES - Sab Subject Ka Data`], {type:'text/plain'});
    let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download='bhai-notes.txt'; a.click();
  }

  chatInput.addEventListener('keydown', e=>{ if(e.key==='Enter') askAI(); });

  // ===== WHITEBOARD WALA PART =====
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let drawing=false, tool='pen', penSize=4, penColor='#000000';
  let lastX=0, lastY=0;

  function resize(){ canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; }
  window.addEventListener('resize', resize); setTimeout(resize,100);

  function setTool(t){
    tool=t;
    document.getElementById('penBtn').classList.toggle('active', t==='pen');
    document.getElementById('eraserBtn').classList.toggle('active', t==='eraser');
  }
  function updateSize(v){ penSize=v; document.getElementById('sizeShow').innerText=v; }
  document.getElementById('penColor').addEventListener('input', e=>{ penColor=e.target.value; });

  function getPos(e){
    let r = canvas.getBoundingClientRect();
    let x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    let y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    return {x,y};
  }
  canvas.addEventListener('mousedown', e=>{ drawing=true; let p=getPos(e); lastX=p.x; lastY=p.y; });
  canvas.addEventListener('mousemove', e=>{ if(!drawing) return; let p=getPos(e); draw(lastX,lastY,p.x,p.y); lastX=p.x; lastY=p.y; });
  canvas.addEventListener('mouseup', ()=> drawing=false);
  canvas.addEventListener('touchstart', e=>{ e.preventDefault(); drawing=true; let p=getPos(e); lastX=p.x; lastY=p.y; }, {passive:false});
  canvas.addEventListener('touchmove', e=>{ e.preventDefault(); if(!drawing) return; let p=getPos(e); draw(lastX,lastY,p.x,p.y); lastX=p.x; lastY=p.y; }, {passive:false});
  canvas.addEventListener('touchend', ()=> drawing=false);

  function draw(x1,y1,x2,y2){
    ctx.lineCap='round'; ctx.lineJoin='round';
    if(tool==='eraser'){ ctx.strokeStyle='white'; ctx.lineWidth=penSize*3; }
    else { ctx.strokeStyle=penColor; ctx.lineWidth=penSize; }
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  }
  function clearBoard(){ ctx.clearRect(0,0,canvas.width,canvas.height); }
  function downloadBoard(){
    let a=document.createElement('a'); a.download='bhai-whiteboard.png'; a.href=canvas.toDataURL(); a.click();
  }
</script>
</body>
</html>
